[project]
name = "autolab-cli"
version = "0.1.0"
description = "CLI for administering the Autolab / carpaintr backend API"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.scripts]
autolab = "autolab_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolab_cli"]
